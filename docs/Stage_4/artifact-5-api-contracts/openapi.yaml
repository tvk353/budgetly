openapi: 3.1.0
info:
  title: Budgetly API
  version: 1.0.0-draft
  description: >
    Draft API contract for Budgetly. All amounts are decimal strings; workspace access
    is checked server-side and enforced again by Supabase RLS. Category access uses
    per-user scopes linked to workspaces through workspace_category_scopes. Background
    job lifecycle status is sourced from background_jobs. Transaction/history endpoints
    use cursor pagination; bounded lists/reports use page-number pagination (default 20,
    maximum 100). Idempotency terminal results are retained for at least 24 hours.
    Annual Drive exports are private and recipient-specific. This OpenAPI file covers the primary
    routes and is a machine-readable subset of the complete route catalogue in API_CONTRACTS.md.
    Prettier successfully parsed/formatted the YAML, but OpenAPI semantics and referenced schemas
    have not been validated. Operation counts match the human-readable catalogue; unresolved
    payload details remain marked as contract gaps rather than inferred here.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Auth
  - name: Workspaces
  - name: Categories
  - name: Transactions
  - name: Budgets
  - name: Savings
  - name: Trackers
  - name: Trash
  - name: Exports
paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      security: []
      summary: Request an email OTP
      description: Generic response to avoid account enumeration; enforce expiry, attempt and resend limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
              additionalProperties: false
      responses:
        '202':
          description: Request accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      security: []
      summary: Verify an email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                otp: { type: string, pattern: '^[0-9]{6}$' }
              additionalProperties: false
      responses:
        '200':
          description: Authenticated; session established by configured auth mechanism
          content:
            application/json:
              schema:
                type: object
                required: [user, session]
                properties:
                  user: { $ref: '#/components/schemas/UserSummary' }
                  session:
                    {
                      type: object,
                      description: Provider-defined session metadata; never return secrets unnecessarily.,
                    }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Update allowed profile fields
      description: Only display_name is writable through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 80 }
              additionalProperties: false
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspaces:
    get:
      tags: [Workspaces]
      summary: List accessible workspaces
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Workspaces]
      summary: Create workspace through trusted server operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { type: string, enum: [personal, household] }
                name: { type: string, minLength: 1, maxLength: 80 }
              additionalProperties: false
      responses:
        '201':
          description: Created workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspaces/{workspaceId}/labels:
    get:
      tags: [Transactions]
      summary: List reusable labels in a workspace
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
        - { $ref: '#/components/parameters/PageNumber' }
      responses:
        '200':
          description: Active labels in the workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Transactions]
      summary: Create a reusable workspace label
      parameters:
        - { $ref: '#/components/parameters/WorkspaceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelCreate' }
      responses:
        '201':
          description: Label created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Label' }
        '409': { description: Active label with this name already exists in workspace }
        '422': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /workspaces/{workspaceId}/transactions:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Transactions]
      summary: List active transactions
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: start_date
          schema: { type: string, format: date }
        - in: query
          name: end_date
          schema: { type: string, format: date }
        - in: query
          name: type
          schema: { type: string, enum: [expense, refund] }
      responses:
        '200':
          description: Transaction page
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  page: { $ref: '#/components/schemas/CursorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Transactions]
      summary: Create an expense or refund
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Created transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /workspaces/{workspaceId}/transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: transactionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Transactions]
      summary: Update a transaction
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                amount: { $ref: '#/components/schemas/Amount' }
                date: { type: string, format: date }
                category_id: { type: string, format: uuid }
                label_id: { type: [string, 'null'], format: uuid }
                description: { type: [string, 'null'], maxLength: 50 }
                notes: { type: [string, 'null'], maxLength: 500 }
              additionalProperties: false
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Transactions]
      summary: Move transaction to Trash
      responses:
        '204': { description: Moved to Trash }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /workspaces/{workspaceId}/budgets/{yyyy-mm}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: yyyy-mm
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    get:
      tags: [Budgets]
      summary: Get budget and calculated summary
      responses:
        '200':
          description: Budget summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
    put:
      tags: [Budgets]
      summary: Create or update budget
      description: Creation is allowed only for the current IST month; past budgets may be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetUpsert' }
      responses:
        '200':
          description: Budget saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspaces/{workspaceId}/exports:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Exports]
      operationId: listExports
      summary: List export jobs visible to the current user
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Export jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Exports]
      summary: Request CSV export
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportCreate' }
      responses:
        '202':
          description: Export job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /workspaces/{workspaceId}/exports/{exportId}/download:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: exportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Exports]
      summary: Authorize and issue short-lived download URL
      description: Re-check current user, workspace membership, job visibility and export status before issuing URL.
      responses:
        '200':
          description: Short-lived URL issued
          content:
            application/json:
              schema:
                type: object
                required: [download_url, expires_at]
                properties:
                  download_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                additionalProperties: false
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Revoke all sessions
      description: The effect on the current session must follow the finalized session-revocation contract.
      responses:
        '204': { description: Sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-contract-gap: Current-session behavior is not specified in the machine-readable contract.
  /account/deletion-requests:
    post:
      tags: [Auth]
      operationId: requestAccountDeletion
      summary: Request account deletion
      description: Disable sign-in according to the approved recovery flow.
      responses:
        '202': { description: Deletion request accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-contract-gap: Request body and accepted response fields are not specified in the catalogue.
  /account/recovery:
    post:
      tags: [Auth]
      operationId: startAccountRecovery
      summary: Start account recovery
      description: Recovery is available within 30 days and requires email verification.
      responses:
        '202': { description: Recovery request accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
      x-contract-gap: Request body and accepted response fields are not specified in the catalogue.
  /account/sessions/revoke:
    post:
      tags: [Auth]
      operationId: revokeSessions
      summary: Revoke selected session or sessions
      responses:
        '204': { description: Sessions revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-contract-gap: Session selector request schema is not specified in the catalogue.
  /account/deletion-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Auth]
      operationId: getAccountDeletionRequest
      summary: Read account deletion or recovery status
      responses:
        '200':
          description: Deletion request status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /account/deletion-requests/{requestId}/cancel:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Auth]
      operationId: cancelAccountDeletion
      summary: Cancel a pending account deletion
      responses:
        '200':
          description: Deletion request cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /settings:
    get:
      tags: [Auth]
      operationId: getSettings
      summary: Read user preferences
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      operationId: updateSettings
      summary: Update permitted user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-contract-gap: Preference fields other than the default workspace are not enumerated.
  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Read workspace details
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Workspaces]
      operationId: updateWorkspace
      summary: Update permitted workspace metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspacePatch' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-contract-gap: The catalogue does not define which workspace fields may be updated.
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceMembers
      summary: List active workspace members
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Active members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Workspaces]
      operationId: removeWorkspaceMember
      summary: Remove a member (owner only)
      responses:
        '204': { description: Member removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspaces/{workspaceId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Workspaces]
      operationId: listWorkspaceInvitations
      summary: List current invitations
      parameters:
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          description: Safe invitation fields only; never include token_hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Workspaces]
      operationId: createWorkspaceInvitation
      summary: Create a household invitation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreate' }
      responses:
        '201':
          description: Invitation created; bearer token is delivered out of band
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /workspaces/{workspaceId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Workspaces]
      operationId: revokeWorkspaceInvitation
      summary: Revoke an invitation
      responses:
        '204': { description: Invitation revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{token}/join:
    parameters:
      - name: token
        in: path
        required: true
        description: Secret bearer token; redact from logs and analytics.
        schema: { type: string, minLength: 1 }
    post:
      tags: [Workspaces]
      operationId: joinInvitedWorkspace
      summary: Join a workspace after verified identity checks
      responses:
        '200':
          description: Joined workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /workspaces/{workspaceId}/ownership-transfer:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: transferWorkspaceOwnership
      summary: Transfer ownership with re-authentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipTransfer' }
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspaces/{workspaceId}/deletion-requests:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: requestWorkspaceDeletion
      summary: Start the 30-day workspace recovery window
      responses:
        '202': { description: Workspace deletion request accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
      x-contract-gap: Confirmation request fields are not specified in the catalogue.
  /workspaces/{workspaceId}/recovery:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags: [Workspaces]
      operationId: recoverWorkspace
      summary: Recover a workspace within 30 days
      responses:
        '200':
          description: Workspace recovered for currently authorized members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
  /workspaces/{workspaceId}/categories:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
