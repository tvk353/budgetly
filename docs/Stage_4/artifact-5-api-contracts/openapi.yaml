components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-budgetly-session
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$' }
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
    PageNumber:
      name: page_number
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    StartDate:
      name: start_date
      in: query
      required: false
      schema: { type: string, format: date }
    EndDate:
      name: end_date
      in: query
      required: false
      schema: { type: string, format: date }
  schemas:
    Resource:
      type: object
      description: Response fields not specified in the route catalogue remain to be finalized.
      additionalProperties: true
    ResourceCollection:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        page: { $ref: '#/components/schemas/Page' }
      additionalProperties: false
    SettingsPatch:
      type: object
      minProperties: 1
      properties:
        default_workspace_id: { type: [string, 'null'], format: uuid }
      additionalProperties: false
    WorkspacePatch:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
      additionalProperties: false
    InvitationCreate:
      type: object
      required: [email, delivery_method]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        delivery_method: { type: string, const: email }
      additionalProperties: false
    OwnershipTransfer:
      type: object
      required: [new_owner_user_id, reauth_proof]
